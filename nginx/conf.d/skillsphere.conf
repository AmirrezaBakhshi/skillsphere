# Reverse proxy in front of both the Django/Daphne backend and the
# Next.js frontend. Nginx is the only container with ports published to
# the host in production - everything else (backend, frontend, db,
# redis, elasticsearch) is reachable only on the internal Docker network.
# See DOCUMENTATION_STAGE6.md for the reasoning behind every section below.

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# Plain HTTP: redirect everything to HTTPS. Kept deliberately minimal -
# this server block's only job is the redirect.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 30M;  # a little above PROJECT_UPLOAD_MAX_SIZE_BYTES's 25MB default

    # --- Django admin ---
    location /admin/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
    }

    # --- REST API ---
    location /api/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
    }

    # --- WebSocket (chat) ---
    # Needs its own location block: the Upgrade/Connection headers below
    # are what let Nginx hand the connection off as a raw, long-lived
    # TCP tunnel to Daphne instead of treating it as a normal HTTP
    # request/response - see DOCUMENTATION_STAGE6.md section 2.
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;  # keep long-lived chat connections open
    }

    # --- Static files (Django admin CSS/JS, DRF browsable API assets) ---
    # Served directly by Nginx, bypassing Django/Daphne entirely - a
    # static file doesn't need Python involved at all.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Media files (user-uploaded project files) ---
    # Same idea: Nginx reads these straight off the shared volume rather
    # than proxying the request through Django just to stream bytes back.
    location /media/ {
        alias /app/media/;
    }

    # --- Everything else: the Next.js frontend ---
    location / {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params.conf;
    }
}
